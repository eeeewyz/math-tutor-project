model:
  name: Qwen/Qwen2.5-0.5B

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  max_length: 2048
  learning_rate: 0.0001
  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  bf16: true
  seed: 42

notes:
  status: initial starting configuration; tune after checking server GPU and baseline results
